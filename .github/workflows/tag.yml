# After a merge to main, tag v<version from package.json> unless that tag exists.
# Version bumps happen inside PRs (e.g. the audit automation); tagging stays deterministic.
name: Tag release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag version
        run: |
          v="v$(node -p 'require("./package.json").version')"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "$v already tagged"
            exit 0
          fi
          git tag "$v"
          git push origin "refs/tags/$v"
