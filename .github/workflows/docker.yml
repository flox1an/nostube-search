name: Build, push, and deploy Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nostube-search

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    env:
      COOLIFY_TAILNET_HOST: ${{ secrets.COOLIFY_TAILNET_HOST }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join Tailnet as tag:ci
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify CI network boundary
        env:
          # host:port-Liste als Secret, damit Tailnet-Adressen nicht im oeffentlichen Log stehen.
          CI_BLOCKED_TARGETS: ${{ secrets.CI_BLOCKED_TARGETS }}
        run: |
          curl --fail --show-error --connect-timeout 10 \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/health"

          [ -n "$CI_BLOCKED_TARGETS" ] || { echo "Secret CI_BLOCKED_TARGETS fehlt" >&2; exit 1; }
          for target in $CI_BLOCKED_TARGETS; do
            if timeout 5 bash -c "</dev/tcp/${target%:*}/${target##*:}" 2>/dev/null; then
              echo "Unexpectedly reached a blocked target" >&2
              exit 1
            fi
          done

      - name: Deploy to Coolify
        run: |
          curl --fail --show-error --request POST \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/deploy?uuid=ybefchtop8deskp8dtsmbexw" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"

      - name: Notify Kuma (deploy heartbeat)
        if: success()
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.KUMA_BASE_URL }}/api/push/${{ secrets.KUMA_PUSH_TOKEN }}?status=up&msg=OK" \
            || echo "::warning::Kuma push failed (ACL oder Kuma nicht erreichbar); Stille-Detektion greift weiter"

  # Meldet einen kaputten Lauf sofort rot, statt ihn erst durch Stille auffallen zu lassen.
  # Eigener Job, weil ein Fehler im build-Job den deploy-Job gar nicht erst startet.
  notify-failure:
    needs: [build, deploy]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join Tailnet as tag:ci
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Notify Kuma (deploy failed)
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.KUMA_BASE_URL }}/api/push/${{ secrets.KUMA_PUSH_TOKEN }}?status=down&msg=CI%20run%20${{ github.run_id }}%20failed" \
            || echo "::warning::Kuma push failed; Stille-Detektion greift weiter"
