name: Verify Tailnet access to Coolify

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify CI network boundary
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Join Tailnet as tag:ci
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify Coolify health endpoint is reachable
        run: |
          curl --fail --show-error --connect-timeout 10 \
            http://coolify.tail238b01.ts.net:8000/api/v1/health

      - name: Verify restricted Tailnet endpoints stay unreachable
        run: |
          blocked() {
            if timeout 5 bash -c "</dev/tcp/$1/$2"; then
              echo "Unexpectedly reached $1:$2" >&2
              return 1
            fi
          }

          blocked 100.85.228.8 22
          blocked 100.108.139.111 8006
