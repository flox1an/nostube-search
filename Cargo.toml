[package]
name = "nostube-search"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
default-run = "nostube-search"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
bech32 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
nostr = { version = "0.45.6", features = ["nip44"] }
nostr-sdk = "0.45.6"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-full"] }
url = "2"

[dev-dependencies]
flate2 = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
# The project needs no `unsafe`; keep it that way.
unsafe_code = "forbid"

[lints.clippy]
# A panic in a request handler or the indexer takes the whole process down.
# Startup-only `expect` calls with a message are allowed individually.
unwrap_used = "warn"
expect_used = "warn"
# Holding a std lock across `.await` can deadlock the async runtime.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
# Leftovers of debugging sessions and unfinished code.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
