<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nostube Search</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0a0a0a; color: #f3f3f3; }
      .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
      h1 { margin: 0 0 16px; font-size: 24px; }
      .search { width: 100%; font-size: 20px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a2a2a; background: #111; color: #fff; }
      .search:focus { outline: 2px solid #3b82f6; border-color: #3b82f6; }
      .completions {
        margin: 4px 0 0;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        max-height: 280px;
        overflow-y: auto;
      }
      .completions .c-item {
        padding: 8px 14px;
        cursor: pointer;
        font-size: 15px;
        color: #d1d5db;
      }
      .completions .c-item:hover,
      .completions .c-item.active {
        background: #2563eb;
        color: #fff;
      }
      .status { margin: 12px 0; min-height: 20px; color: #aaa; }
      .error { background: #3a1212; color: #ffb4b4; border: 1px solid #6c1c1c; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .card { display: grid; grid-template-columns: 160px 1fr; gap: 12px; background: #111; border: 1px solid #222; border-radius: 12px; padding: 10px; }
      .thumb { width: 160px; height: 90px; object-fit: cover; border-radius: 8px; background: #2f2f2f; }
      .title { margin: 0 0 6px; font-weight: 700; font-size: 16px; color: #fff; }
      .meta { font-size: 12px; color: #aaa; margin-bottom: 6px; }
      .summary { font-size: 13px; color: #c8c8c8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .tag { font-size: 11px; background: #1f2937; color: #cfe2ff; padding: 2px 8px; border-radius: 999px; }
      .badge { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; margin-right: 6px; }
      .score { display: inline-block; font-size: 11px; font-weight: 700; color: #f9fafb; background: #334155; border: 1px solid #475569; border-radius: 999px; padding: 2px 8px; margin-left: 6px; }
      .k21 { background: #1d4ed8; }
      .k22 { background: #15803d; }
      .k34235 { background: #7e22ce; }
      .k34236 { background: #c2410c; }
      .kOther { background: #374151; }
      .load-more { margin: 18px auto 0; display: block; border: 1px solid #2a2a2a; background: #111; color: #fff; padding: 10px 16px; border-radius: 10px; cursor: pointer; }
      .load-more:disabled { opacity: 0.5; cursor: wait; }
      .skeleton { height: 110px; border-radius: 12px; background: linear-gradient(90deg, #111 25%, #1a1a1a 50%, #111 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
      @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Nostube Video Search</h1>
      <input id="q" class="search" placeholder="Search videos..." autofocus />
      <div id="completions" class="completions" hidden></div>
      <div id="error"></div>
      <div id="status" class="status"></div>
      <div id="results" class="grid"></div>
      <button id="loadMore" class="load-more" hidden>Load more</button>
    </div>

    <script>
      const qInput = document.getElementById('q')
      const resultsEl = document.getElementById('results')
      const statusEl = document.getElementById('status')
      const errorEl = document.getElementById('error')
      const loadMoreBtn = document.getElementById('loadMore')
      const completionsEl = document.getElementById('completions')

      let query = ''
      let limit = 20
      let offset = 0
      let total = 0
      let loading = false
      let debounceTimer
      let completionTimer
      let activeCompletionIndex = -1
      let currentCompletions = []

      function escapeHtml(s) {
        return String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      }

      const IMGPROXY_URL = 'https://imgproxy.nostu.be/'

      function imageProxy(url) {
        if (!url) return ''
        if (url.startsWith('data:')) return url
        const base = IMGPROXY_URL.replace(/\/$/, '')
        return `${base}/insecure/f:webp/rs:fit:480:480/plain/${encodeURIComponent(url)}`
      }

      function truncatePubkey(pubkey) {
        if (!pubkey) return ''
        return `${pubkey.slice(0, 12)}…${pubkey.slice(-8)}`
      }

      function kindClass(kind) {
        if (kind === 21) return 'k21'
        if (kind === 22) return 'k22'
        if (kind === 34235) return 'k34235'
        if (kind === 34236) return 'k34236'
        return 'kOther'
      }

      function kindLabel(kind) {
        if (kind === 21) return 'Video'
        if (kind === 22) return 'Short'
        if (kind === 34235) return 'Reel'
        if (kind === 34236) return 'Clip'
        return `Kind ${kind}`
      }

      function dateLabel(ts) {
        if (!ts) return ''
        return new Date(ts * 1000).toLocaleDateString()
      }

      function scoreLabel(score) {
        const n = Number(score)
        return Number.isFinite(n) ? n.toFixed(4) : '0.0000'
      }

      function renderSkeletons() {
        resultsEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'
      }

      function renderItems(items, append = false) {
        const html = items.map(item => {
          const tags = (item.tags || []).slice(0, 6).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')
          const hasThumb = !!item.thumbnail
          const hasVideo = !!item.videoUrl
          const primaryThumb = hasThumb ? imageProxy(item.thumbnail) : ''
          const fallbackThumb = hasVideo ? imageProxy(item.videoUrl) : ''
          const kindLabelText = kindLabel(item.kind)
          const rankingScore = scoreLabel(item.rankingScore)

          // Generate a unique id for this card's thumbnail state
          const uid = 'thumb-' + item.event_id

          return `<article class="card">
            <a href="${escapeHtml(item.nostrUrl)}" target="_blank" rel="noopener noreferrer" class="thumb-link" style="display:contents;text-decoration:none;color:inherit">
              <div class="thumb-wrapper" style="position:relative;width:160px;height:90px;flex-shrink:0">
                ${hasThumb || hasVideo
                  ? `<img
                      id="${uid}"
                      class="thumb"
                      src="${escapeHtml(primaryThumb || fallbackThumb)}"
                      alt="thumbnail"
                      loading="lazy"
                      data-fallback="${escapeHtml(fallbackThumb)}"
                      onerror="this.onerror=null;const fb=this.dataset.fallback;if(fb&&this.src!==fb){this.src=fb}else{this.alt='Thumbnail unavailable';this.style.display='none';this.parentElement.innerHTML='<div class=\"thumb\" style=\"display:flex;align-items:center;justify-content:center;background:#2f2f2f;color:#666;font-size:12px\">No thumbnail</div>'}"
                    />`
                  : '<div class="thumb" style="display:flex;align-items:center;justify-content:center;background:#2f2f2f;color:#666;font-size:12px">No thumbnail</div>'
                }
              </div>
              <div>
                <h3 class="title">${escapeHtml(item.title || 'Untitled')}</h3>
                <div class="meta">
                  <span class="badge ${kindClass(item.kind)}">${escapeHtml(kindLabelText)}</span>
                  ${escapeHtml(item.authorDisplayName ? item.authorDisplayName : truncatePubkey(item.pubkey))} · ${escapeHtml(dateLabel(item.created_at))}
                  <span class="score">Score ${escapeHtml(rankingScore)}</span>
                </div>
                <div class="summary">${escapeHtml(item.content_preview || '')}</div>
                <div class="tags">${tags}</div>
              </div>
            </a>
          </article>`
        }).join('')

        if (append) {
          resultsEl.insertAdjacentHTML('beforeend', html)
        } else {
          resultsEl.innerHTML = html
        }
      }

      function setError(message) {
        errorEl.innerHTML = message ? `<div class="error">${escapeHtml(message)}</div>` : ''
      }

      function updateLoadMore() {
        const hasMore = offset + limit < total
        loadMoreBtn.hidden = !hasMore || !query
      }

      async function search(append = false) {
        if (!query || loading) return
        loading = true
        setError('')
        if (!append) renderSkeletons()
        statusEl.textContent = 'Searching...'
        loadMoreBtn.disabled = true

        try {
          const url = new URL('/api/search', window.location.origin)
          url.searchParams.set('q', query)
          url.searchParams.set('limit', String(limit))
          url.searchParams.set('offset', String(offset))

          const res = await fetch(url)
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Request failed')

          total = Number(data.total || 0)
          const hits = Array.isArray(data.hits) ? data.hits : []

          if (hits.length === 0 && !append) {
            resultsEl.innerHTML = ''
            statusEl.textContent = 'No results found'
          } else {
            renderItems(hits, append)
            statusEl.textContent = `Showing ${Math.min(offset + hits.length, total)} of ${total}`
          }
          updateLoadMore()
        } catch (err) {
          if (!append) resultsEl.innerHTML = ''
          setError(err.message || 'Search failed')
          statusEl.textContent = ''
        } finally {
          loading = false
          loadMoreBtn.disabled = false
        }
      }

      function getCurrentWord(text, cursorPos) {
        let start = cursorPos
        while (start > 0 && /\p{L}/u.test(text[start - 1])) start--
        let end = cursorPos
        while (end < text.length && /\p{L}/u.test(text[end])) end++
        return { word: text.slice(start, end).toLowerCase(), start, end }
      }

      async function fetchCompletions(prefix) {
        if (!prefix || prefix.length < 1) {
          completionsEl.hidden = true
          currentCompletions = []
          activeCompletionIndex = -1
          return
        }
        try {
          const res = await fetch('/api/search/completion?prefix=' + encodeURIComponent(prefix))
          const data = await res.json()
          currentCompletions = data.completions || []
          renderCompletions(currentCompletions)
        } catch {
          currentCompletions = []
          activeCompletionIndex = -1
          completionsEl.hidden = true
        }
      }

      function renderCompletions(list) {
        if (!list.length) {
          completionsEl.hidden = true
          activeCompletionIndex = -1
          return
        }
        completionsEl.innerHTML = list.map((w, i) =>
          `<div class="c-item${i === 0 ? ' active' : ''}" data-index="${i}">${escapeHtml(w)}</div>`
        ).join('')
        completionsEl.hidden = false
        activeCompletionIndex = 0
      }

      qInput.addEventListener('input', () => {
        query = qInput.value.trim()
        clearTimeout(debounceTimer)
        clearTimeout(completionTimer)

        const cursorPos = qInput.selectionStart ?? qInput.value.length
        const currentWord = getCurrentWord(qInput.value, cursorPos)
        completionTimer = setTimeout(() => {
          fetchCompletions(currentWord.word)
        }, 150)

        if (!query) {
          resultsEl.innerHTML = ''
          statusEl.textContent = ''
          setError('')
          loadMoreBtn.hidden = true
          completionsEl.hidden = true
          currentCompletions = []
          activeCompletionIndex = -1
          return
        }

        debounceTimer = setTimeout(() => {
          offset = 0
          total = 0
          search(false)
        }, 300)
      })

      qInput.addEventListener('keydown', (e) => {
        if ((e.key === 'Tab' || e.key === 'Enter') && currentCompletions.length > 0) {
          e.preventDefault()
          const cursorPos = qInput.selectionStart ?? qInput.value.length
          const cw = getCurrentWord(qInput.value, cursorPos)
          const replacement = currentCompletions[activeCompletionIndex >= 0 ? activeCompletionIndex : 0]
          if (cw && replacement) {
            const before = qInput.value.slice(0, cw.start)
            const after = qInput.value.slice(cw.end)
            qInput.value = before + replacement + ' ' + after
            const newPos = cw.start + replacement.length + 1
            qInput.setSelectionRange(newPos, newPos)
            completionsEl.hidden = true
            currentCompletions = []
            activeCompletionIndex = -1
            qInput.dispatchEvent(new Event('input'))
          }
        }

        if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && currentCompletions.length > 0) {
          e.preventDefault()
          const delta = e.key === 'ArrowDown' ? 1 : -1
          const items = completionsEl.querySelectorAll('.c-item')
          items.forEach(el => el.classList.remove('active'))
          activeCompletionIndex = Math.max(0, Math.min(currentCompletions.length - 1, activeCompletionIndex + delta))
          items[activeCompletionIndex]?.classList.add('active')
          items[activeCompletionIndex]?.scrollIntoView({ block: 'nearest' })
        }
      })

      completionsEl.addEventListener('click', (e) => {
        const item = e.target.closest('.c-item')
        if (!item) return
        const replacement = currentCompletions[Number(item.dataset.index)]
        if (!replacement) return
        const cursorPos = qInput.selectionStart ?? qInput.value.length
        const cw = getCurrentWord(qInput.value, cursorPos)
        if (cw) {
          const before = qInput.value.slice(0, cw.start)
          const after = qInput.value.slice(cw.end)
          qInput.value = before + replacement + ' ' + after
          const newPos = cw.start + replacement.length + 1
          qInput.setSelectionRange(newPos, newPos)
        }
        completionsEl.hidden = true
        currentCompletions = []
        activeCompletionIndex = -1
        qInput.dispatchEvent(new Event('input'))
      })

      qInput.addEventListener('blur', () => {
        setTimeout(() => {
          completionsEl.hidden = true
        }, 200)
      })

      loadMoreBtn.addEventListener('click', () => {
        offset += limit
        search(true)
      })
    </script>
  </body>
</html>
